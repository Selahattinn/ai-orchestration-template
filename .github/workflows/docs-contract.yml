name: Docs Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docs contract
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          repo = pathlib.Path('.').resolve()
          errors = []

          required_files = [
              'AGENTS.md',
              'README.md',
              '.github/pull_request_template.md',
              '.github/workflows/orchestration-contract.yml',
              'workflows/ORCHESTRATION_FLOW.md',
              'workflows/STAGE_CONTRACT.md',
              'workflows/ARCHITECTURE_PATTERN_REGISTRY.md',
              'docs/MODEL_POLICY.md',
              'docs/COST_LATENCY_BUDGET.md',
              'docs/SECURITY_POLICY.md',
              'docs/EVAL_RUBRIC.md',
              'docs/RUN_LOG_STANDARD.md',
              'docs/CODING_STYLE.md',
              'docs/LOGGING_STANDARD.md',
              'docs/FILE_HIERARCHY.md',
              'docs/NAMING_STANDARD.md',
              'docs/TESTING_STANDARD.md',
              'docs/QUALITY_GATE.md',
              'docs/IMPLEMENTATION_PROTOCOL.md',
              'docs/PROJECT_PROFILE.md',
              'docs/BOOTSTRAP_INTERVIEW.md',
              'docs/ARCHITECTURE_STYLE_GUIDE.md',
              'docs/HEXAGONAL_BOUNDARY_STANDARD.md',
              'docs/MANDATORY_ENFORCEMENT_POLICY.md',
              'docs/WORKTREE_STANDARD.md',
              'docs/BRANCH_PROTECTION.md',
              'docs/NOW_NEXT_LATER.md',
              'docs/QUICK_ONBOARDING.md',
              'templates/RUN_MANIFEST_TEMPLATE.json',
              'tools/stage_orchestrator.py',
              'tools/validate_run.py',
              'runs/latest/manifest.json',
              'skills/worktree-setup/SKILL.md',
          ]

          for rel in required_files:
              if not (repo / rel).exists():
                  errors.append(f'Missing required file: {rel}')

          standards_with_done = [
              'docs/MODEL_POLICY.md',
              'docs/COST_LATENCY_BUDGET.md',
              'docs/SECURITY_POLICY.md',
              'docs/EVAL_RUBRIC.md',
              'docs/RUN_LOG_STANDARD.md',
              'docs/CODING_STYLE.md',
              'docs/LOGGING_STANDARD.md',
              'docs/FILE_HIERARCHY.md',
              'docs/NAMING_STANDARD.md',
              'docs/TESTING_STANDARD.md',
              'docs/PROJECT_PROFILE.md',
              'docs/BOOTSTRAP_INTERVIEW.md',
              'docs/ARCHITECTURE_STYLE_GUIDE.md',
              'docs/HEXAGONAL_BOUNDARY_STANDARD.md',
              'docs/MANDATORY_ENFORCEMENT_POLICY.md',
              'docs/WORKTREE_STANDARD.md',
              'docs/BRANCH_PROTECTION.md',
          ]

          for rel in standards_with_done:
              path = repo / rel
              if path.exists():
                  content = path.read_text(encoding='utf-8')
                  if '## Done Criteria' not in content:
                      errors.append(f'Missing "## Done Criteria" section: {rel}')

          mandatory_policy = repo / 'docs/MANDATORY_ENFORCEMENT_POLICY.md'
          if mandatory_policy.exists():
              content = mandatory_policy.read_text(encoding='utf-8')
              required_flags = [
                  'rules_mode: mandatory_all',
                  'orchestration_mode: mandatory',
                  'worktree_mode: mandatory',
                  'bypass_policy: prohibited',
                  'exception_policy: explicit_waiver_only',
              ]
              for flag in required_flags:
                  if flag not in content:
                      errors.append(f'Mandatory policy missing flag: {flag}')

          orchestration_flow = repo / 'workflows/ORCHESTRATION_FLOW.md'
          if orchestration_flow.exists():
              flow = orchestration_flow.read_text(encoding='utf-8')
              required_flow_rules = [
                  'Orchestration bypass is prohibited',
                  'Single-agent direct completion is invalid',
                  'Every stage must run in its dedicated git worktree',
              ]
              for rule in required_flow_rules:
                  if rule not in flow:
                      errors.append(f'Orchestration flow missing rule: {rule}')

          stage_contract = repo / 'workflows/STAGE_CONTRACT.md'
          if stage_contract.exists():
              contract = stage_contract.read_text(encoding='utf-8')
              required_contract_rules = [
                  'stage_id: worktree_setup',
                  'stage_id: api_scope',
                  'stage_id: go_fit_check',
                  'stage_id: architecture',
                  'stage_id: testing_plan',
                  'stage_id: style_gate',
                  'stage_id: final_review',
                  'CI fails when stage order, artifact presence, waiver rules, or worktree policy rules are violated.',
              ]
              for rule in required_contract_rules:
                  if rule not in contract:
                      errors.append(f'Stage contract missing rule: {rule}')

          architecture_registry = repo / 'workflows/ARCHITECTURE_PATTERN_REGISTRY.md'
          if architecture_registry.exists():
              registry = architecture_registry.read_text(encoding='utf-8')
              rows = []
              for raw in registry.splitlines():
                  line = raw.strip()
                  if not line.startswith('|'):
                      continue

                  cells = [cell.strip() for cell in line.strip('|').split('|')]
                  if len(cells) < 4:
                      continue

                  first_four = cells[:4]
                  if first_four[0].lower() == 'pattern_id':
                      continue

                  if all(re.fullmatch(r':?-{3,}:?', cell) for cell in first_four):
                      continue

                  cleaned = tuple(cell.strip().strip('`').strip() for cell in first_four)
                  if all(cleaned):
                      rows.append(cleaned)

              if not rows:
                  errors.append('Architecture registry has no valid pattern rows')
              else:
                  seen_pattern_ids = set()
                  active_count = 0
                  default_count = 0

                  for pattern_id, skill_rel, status, default in rows:
                      pattern_id = pattern_id.strip()
                      skill_rel = skill_rel.strip()
                      status_norm = status.strip().lower()
                      default_norm = default.strip().lower()

                      if pattern_id in seen_pattern_ids:
                          errors.append(f'Duplicate pattern_id in architecture registry: {pattern_id}')
                      seen_pattern_ids.add(pattern_id)

                      if status_norm not in {'active', 'deprecated', 'experimental'}:
                          errors.append(
                              f'Architecture registry invalid status for {pattern_id}: {status_norm}'
                          )

                      skill_path = repo / skill_rel
                      if not skill_path.exists():
                          errors.append(
                              f'Architecture registry skill file does not exist for {pattern_id}: {skill_rel}'
                          )

                      if status_norm == 'active':
                          active_count += 1

                      if default_norm in {'yes', 'true'}:
                          default_count += 1

                  if active_count == 0:
                      errors.append('Architecture registry must have at least one active pattern')
                  if default_count != 1:
                      errors.append(
                          'Architecture registry must have exactly one default pattern row'
                      )

          hexagonal_standard = repo / 'docs/HEXAGONAL_BOUNDARY_STANDARD.md'
          if hexagonal_standard.exists():
              content = hexagonal_standard.read_text(encoding='utf-8')
              required_hex_rules = [
                  '## Canonical Hierarchy (Hexagonal Mode)',
                  '## Inbound/Outbound Semantics',
                  '## Dependency Direction Rules',
                  '## Block Conditions',
              ]
              for rule in required_hex_rules:
                  if rule not in content:
                      errors.append(f'Hexagonal standard missing section: {rule}')

          worktree_standard = repo / 'docs/WORKTREE_STANDARD.md'
          if worktree_standard.exists():
              content = worktree_standard.read_text(encoding='utf-8')
              required_worktree_rules = [
                  '## Mandatory Rules',
                  '## Stage 0 Requirement',
                  '## Validation Rules',
                  '## Block Conditions',
              ]
              for rule in required_worktree_rules:
                  if rule not in content:
                      errors.append(f'Worktree standard missing section: {rule}')

          pr_template = repo / '.github/pull_request_template.md'
          if pr_template.exists():
              content = pr_template.read_text(encoding='utf-8')
              required_sections = [
                  '## Context',
                  '## What Changed',
                  '## Why It Matters',
                  '## Risks and Trade-offs',
                  '## Breaking Changes',
                  '## Migration Notes',
                  '## Validation',
                  '## Follow-ups',
              ]
              for section in required_sections:
                  if section not in content:
                      errors.append(f'PR template missing section: {section}')

          link_pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          md_files = [p for p in repo.rglob('*.md') if '.git/' not in str(p)]

          for md in md_files:
              text = md.read_text(encoding='utf-8')
              for raw_link in link_pattern.findall(text):
                  link = raw_link.strip()
                  if not link:
                      continue
                  if link.startswith(('http://', 'https://', 'mailto:', '#', '/')):
                      continue
                  if '://' in link:
                      continue

                  target = link.split('#', 1)[0].strip()
                  if not target:
                      continue

                  target_path = (md.parent / target).resolve()
                  if not target_path.exists():
                      errors.append(f'Broken relative link in {md.relative_to(repo)}: {link}')

          if errors:
              print('Docs contract failed:')
              for e in errors:
                  print(f'- {e}')
              sys.exit(1)

          print('Docs contract passed.')
          PY
