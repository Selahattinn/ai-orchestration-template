name: PR Body Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required PR sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || "").replace(/\r/g, "");
            const required = ["Breaking Changes", "Migration Notes", "Validation"];
            const errors = [];

            if (body.includes("\\n")) {
              errors.push("PR body contains literal \\\\n characters. Use real line breaks and create/edit PR body via --body-file.");
            }

            const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

            const extractSection = (title) => {
              const pattern = new RegExp(
                `##\\s+${escapeRegex(title)}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`,
                "i"
              );
              const match = body.match(pattern);
              return match ? match[1].trim() : null;
            };

            const isPlaceholder = (text, section) => {
              const normalized = text.trim().toLowerCase();
              if (normalized.length === 0) return true;

              const allowShort = section === "Breaking Changes" || section === "Migration Notes";
              const allowedShortAnswers = ["none", "none.", "not required", "not required."];
              if (allowShort && allowedShortAnswers.includes(normalized)) return false;

              const blocked = ["tbd", "todo", "n/a", "na", "...", "-", "*"];
              return blocked.includes(normalized);
            };

            for (const section of required) {
              const value = extractSection(section);

              if (value === null) {
                errors.push(`Missing required section: \"${section}\"`);
                continue;
              }

              if (isPlaceholder(value, section)) {
                errors.push(`Section \"${section}\" is empty or placeholder content.`);
              }
            }

            if (errors.length > 0) {
              core.setFailed([
                "PR description contract failed:",
                ...errors.map((e) => `- ${e}`),
                "",
                "Required sections: Breaking Changes, Migration Notes, Validation.",
                "Allowed short values ('None', 'Not required') are only for Breaking Changes and Migration Notes."
              ].join("\n"));
            } else {
              core.info("PR description contract passed.");
            }
